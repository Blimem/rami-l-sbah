<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#071a21">
  <meta name="description" content="Rami Tounsi online: al3ab rami m3a s7abek wala contre l'ordi.">
  <title>Rami Tounsi — online</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/outfit-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script src="config.js"></script>
  <script type="module" src="js/ui/app.js"></script>
</head>
<body>
  <!-- HOME -->
  <section class="screen active" id="home">
    <header class="topbar">
      <div class="brand"><span data-logo></span><div class="word">Rami<small>TOUNSI</small></div></div>
      <div class="spacer"></div>
      <span class="chip off" data-status>Connexion…</span>
      <button class="btn icon ghost" data-rules data-i18n-title="home.rules">?</button>
      <button class="btn icon ghost" data-sound title="Sout">🔊</button>
      <button class="btn icon ghost" data-settings data-i18n-title="settings">⚙️</button>
      <button class="profile-chip" id="profile-chip"></button>
    </header>
    <main class="home">
      <section class="hero panel slim">
        <div>
          <div class="eyebrow" data-i18n="home.eyebrow"></div>
          <h1>Rami <span>Tounsi</span><span class="ar">رامي تونسي</span></h1>
          <p data-i18n="home.tagline"></p>
        </div>
        <div class="stats"><div><b>2–4</b><span data-i18n="home.players"></span></div><div><b>71</b><span data-i18n="home.opening"></span></div><div><b>108</b><span data-i18n="home.cards"></span></div></div>
      </section>
      <div class="modes">
        <section class="panel mode">
          <div class="mode-head"><span class="mode-ic">👥</span><div><h2 data-i18n="home.friends"></h2><small data-i18n="home.friendsSub"></small></div></div>
          <button class="btn gold wide" id="btn-create" data-i18n="home.createTable"></button>
          <form class="joinbox" id="join-form"><input class="input" id="join-code" maxlength="6" placeholder="CODE" autocomplete="off"><button class="btn" data-i18n="home.join"></button></form>
        </section>
        <section class="panel mode">
          <div class="mode-head"><span class="mode-ic">🤖</span><div><h2 data-i18n="home.training"></h2><small data-i18n="home.trainingSub"></small></div><div class="spacer"></div><span class="chip">Offline</span></div>
          <div class="train-btns"><button class="btn violet" data-train="1">🤖 <span data-i18n="home.vs1"></span></button><button class="btn violet" data-train="3">👥 <span data-i18n="home.four"></span></button></div>
          <div class="eyebrow small-eyebrow" data-i18n="botLevel"></div>
          <div id="train-level"></div>
          <details class="train-more"><summary data-i18n="home.matchSettings"></summary><div id="solo-form" class="settings"></div></details>
        </section>
        <section class="panel mode online-mode">
          <div class="om-main">
            <span class="chip" data-i18n="home.onlineChip"></span>
            <h2 class="om-title" data-i18n="home.online"></h2>
            <p class="muted" data-i18n="home.onlineSub"></p>
            <span class="chip off" data-status>…</span>
          </div>
          <div class="om-side"><div class="fan" id="fan" aria-hidden="true"></div><button class="btn gold lg play-btn" id="btn-quick">⚡ <span data-i18n="home.play"></span></button></div>
          <div class="om-rooms"><div class="eyebrow small-eyebrow" data-i18n="home.tables"></div><div class="rooms" id="rooms"></div></div>
        </section>
      </div>
      <section class="panel tip"><div class="eyebrow" data-i18n="home.tip"></div><div class="muted" data-i18n="home.tipText"></div></section>
    </main>
  </section>

  <!-- WAITING ROOM -->
  <section class="screen" id="wait">
    <header class="topbar">
      <div class="brand"><span data-logo></span><div class="word">Rami<small>TOUNSI</small></div></div>
      <div class="spacer"></div>
      <span class="chip off" data-status>…</span>
      <button class="btn icon ghost" data-settings>⚙️</button>
    </header>
    <main class="wait">
      <section class="panel wait-main" id="wait-main"></section>
      <aside id="wait-chat"></aside>
    </main>
  </section>

  <!-- GAME -->
  <section class="screen" id="game">
    <header class="hud">
      <button class="btn icon sm ghost flip-rtl" id="g-leave" data-i18n-title="leave">←</button>
      <div class="title" id="g-title"></div>
      <div class="spacer"></div>
      <span id="g-voice" class="row" style="gap:6px"></span>
      <button class="btn icon sm ghost" data-rules>?</button>
      <button class="btn icon sm ghost" data-settings>⚙️</button>
      <button class="btn icon sm ghost" id="g-scores" title="Score">🏆</button>
      <button class="btn icon sm ghost" id="g-chat" title="Chat" style="position:relative">💬</button>
    </header>
    <div class="opps" id="opps"></div>
    <div class="felt">
      <div class="melds" id="melds"></div>
      <div class="piles" id="piles"></div>
    </div>
    <div class="me">
      <div class="stage" id="stage"></div>
      <div class="me-bar" id="me-bar"></div>
      <div class="hand" id="hand"></div>
    </div>
  </section>
  <aside class="drawer"></aside>
</body>
</html>
