services:
  - type: web
    name: rami-tounsi
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_CLIENT_ID   # optionnel: connexion Gmail (choof README)
        sync: false
      - key: DATA_DIR
        value: ./data
